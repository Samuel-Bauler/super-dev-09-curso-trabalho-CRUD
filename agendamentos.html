<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos</title>
    <link rel="stylesheet" href="assets/css/agendamentos.css">
</head>
<body>
    <div id="all">

        <div class="nav-bar">
            <a href="agendamentos.html" class="agendamentos">Agendamentos</a>
            <a href="clientes.html" class="clientes">Clientes</a>
        </div>
        
        <div class="banner">
            <div class="banner-overlay"></div>
            <div class="banner-content">
                <h1 class="agendamentos-title">Agendamentos</h1>
                <p class="agendamentos-subtitle">Gerencie os agendamentos da mecânica.</p>
            </div>
        </div>

        <div class="form-card">
            <div class="campo">
                <label for="cliente">Cliente</label>
                <input type="text" id="cliente" name="cliente" placeholder="Nome do cliente">
            </div>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao" placeholder="Ex: Troca de óleo">
            </div>

            <div class="campo">
                <label for="data">Data</label>
                <input type="date" id="data" name="data" placeholder="Ex: 26/10/2026">
            </div>


            <button id="botao-agendar">+ Agendar</button>
        </div>

        <table id="tabela-agendamentos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Descrição</th>
                    <th>Data</th>

                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="agendamentos">
                <tr>
                    <td class="col-id">01</td>
                    <td class="col-nome">Lorenzo</td>
                    <td class="col-servico">Troca de óleo</td>
                    <td>Data</td>
                    <td>
                        <button class="botao-editar">Editar</button>
                        <button class="botao-apagar">Apagar</button>
                    </td>
                </tr>
        </table>
    </div>

    <script src="assets/js/agendamentos.js"></script>
</body>
</html>
