<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecanica - Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2937'/%3E%3Cpath d='M14 36h4l5-12h18l5 12h4v11h-5a7 7 0 0 1-14 0h-4a7 7 0 0 1-14 0h-5V36z' fill='%23f97316'/%3E%3Cpath d='M24 28h16l3 8H21l3-8z' fill='%23fff7ed'/%3E%3Ccircle cx='20' cy='47' r='4' fill='%23111827'/%3E%3Ccircle cx='44' cy='47' r='4' fill='%23111827'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="dashboard">
        <div class="dashboard__header">
            <h1 class="dashboard__title">Dashboard da mecanica</h1>
            <p class="dashboard__subtitle">Resumo rapido dos clientes e agendamentos.</p>
        </div>

        <div class="dashboard__stats">
            <div class="stat-card" id="clientes-card">
                <p class="stat-card__label">Clientes</p>
                <p class="stat-card__value" id="numero-clientes">0</p>
                <p class="stat-card__hint">Total de clientes cadastrados</p>
            </div>

            <div class="stat-card" id="agendamentos-card">
                <p class="stat-card__label">Agendamentos</p>
                <p class="stat-card__value" id="numero-agendamentos">0</p>
                <p class="stat-card__hint">Total de agendamentos registrados</p>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
