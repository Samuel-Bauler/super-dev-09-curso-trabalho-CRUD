<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

    <section class="hero">
        <div class="overlay">
            <h1>Clientes</h1>
            <p>Cadastre e acompanhe os clientes da mecânica.</p>

            <div class="cards">
                <div class="card">
                    <h2>4</h2>
                    <span>Clientes cadastrados</span>
                </div>

                <div class="card">
                    <h2>4</h2>
                    <span>Com telefone</span>
                </div>
            </div>
        </div>
    </section>

    <section class="form-box">
        <h3>Adicionar novo cliente</h3>

        <div class="inputs">
            <input type="text" placeholder="Nome do cliente">
            <input type="text" placeholder="Telefone do cliente">

            <button>Cadastrar cliente</button>
        </div>
    </section>

    <section class="table-box">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>NOME</th>
                    <th>TELEFONE</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>41</td>
                    <td>samuell</td>
                    <td>(31) 2985-2738</td>
                    <td>
                        <button class="edit">Editar</button>
                        <button class="delete">Apagar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

</div>
</body>
</html>
